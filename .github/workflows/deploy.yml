name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 仓库是项目页，站点挂在 https://<user>.github.io/<repo>/ 下
          # 若日后改了仓库名或改用自定义域名，改这两行即可
          BASE_PATH: /portfolio-site
          SITE_URL: https://raymundo803.github.io
        run: npm run build

      - name: Verify build output
        run: |
          set -eu

          # 1) 站内链接必须带 base 前缀，否则 Pages 上点哪都是 404
          if ! grep -q 'href="/portfolio-site/' dist/index.html; then
            echo "::error::站内链接缺少 base 前缀，检查 BASE_PATH"
            exit 1
          fi

          # 2) canonical 必须用 SITE_URL。
          #    这里只查 canonical，不要全文搜 yourdomain.com ——
          #    site.ts 里的占位邮箱会被页脚渲染进每个页面，误报成失败。
          CANONICAL=$(grep -o 'rel="canonical" href="[^"]*"' dist/index.html | head -1)
          echo "canonical → ${CANONICAL:-<未找到>}"
          case "$CANONICAL" in
            *yourdomain.com*)
              echo "::error::canonical 仍是占位域名，SITE_URL 没有生效"
              exit 1
              ;;
          esac

          # 3) favicon / rss 这类根级资源也要带前缀
          if ! grep -q 'href="/portfolio-site/rss.xml"' dist/index.html; then
            echo "::error::rss.xml 链接缺少 base 前缀"
            exit 1
          fi

          echo "构建产物校验通过"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 站点只能由仓库管理员在 Settings 里创建：试过用 GITHUB_TOKEN 调
      # POST /repos/{owner}/{repo}/pages，返回 403 —— workflow 令牌权限不足，
      # 这条路走不通。所以这里只做检测，没启用就跳过并指路，不制造红色失败。
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API → HTTP $code"
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Pages 已启用，继续部署"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages 尚未启用，部署已跳过::请到 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/pages ，把 Source 选为 GitHub Actions 并保存。保存后重跑本工作流即可。"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
