name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 仓库是项目页，站点挂在 https://<user>.github.io/<repo>/ 下
          # 若日后改了仓库名或改用自定义域名，改这两行即可
          BASE_PATH: /portfolio-site
          SITE_URL: https://raymundo803.github.io
        run: npm run build

      - name: Verify build output
        run: |
          set -eu

          # 1) 站内链接必须带 base 前缀，否则 Pages 上点哪都是 404
          if ! grep -q 'href="/portfolio-site/' dist/index.html; then
            echo "::error::站内链接缺少 base 前缀，检查 BASE_PATH"
            exit 1
          fi

          # 2) canonical 必须用 SITE_URL。
          #    这里只查 canonical，不要全文搜 yourdomain.com ——
          #    site.ts 里的占位邮箱会被页脚渲染进每个页面，误报成失败。
          CANONICAL=$(grep -o 'rel="canonical" href="[^"]*"' dist/index.html | head -1)
          echo "canonical → ${CANONICAL:-<未找到>}"
          case "$CANONICAL" in
            *yourdomain.com*)
              echo "::error::canonical 仍是占位域名，SITE_URL 没有生效"
              exit 1
              ;;
          esac

          # 3) favicon / rss 这类根级资源也要带前缀
          if ! grep -q 'href="/portfolio-site/rss.xml"' dist/index.html; then
            echo "::error::rss.xml 链接缺少 base 前缀"
            exit 1
          fi

          echo "构建产物校验通过"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 仓库没启用 Pages 时，deploy-pages 只会抛一个没有指向性的 404。
      # 这里不只检测，还尝试用 GITHUB_TOKEN 直接把 Pages 站点建起来
      # （build_type=workflow），省得每次都要去 Settings 里手动点。
      - name: Ensure Pages is enabled
        id: pages
        env:
          # GITHUB_TOKEN 是自动创建的 secret，但不会自动进入 shell 环境，
          # 必须显式注入，否则 curl 发出的是匿名请求 → 401。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resp=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"build_type":"workflow"}')
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "创建 Pages → HTTP $code"
          printf '%s\n' "$body" | head -4

          case "$code" in
            200|201)
              echo "Pages 站点已创建，等待 GitHub 完成初始化"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              sleep 15
              ;;
            409|422)
              # 已存在，正常的重复部署
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
              echo "Pages 已存在（查询返回 $code）"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=无法启用 Pages::HTTP $code"
              printf '%s\n' "$body" | head -5
              echo "::error::请手动到 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/pages ，把 Source 选为 GitHub Actions 并保存，然后重跑本工作流"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
