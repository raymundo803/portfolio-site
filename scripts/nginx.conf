# 静态站点 nginx 配置（放到 /etc/nginx/conf.d/yourdomain.conf）
# 把 yourdomain 换成你的域名，或先用 _ 做临时配置

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # 大陆节点必须备案后域名才能解析；未备案时把 server_name 改成 ""
    # 并用 IP 访问即可，避免"未备案拦截页"

    root /var/www/html;
    index index.html;

    # SPA/静态站：找不到就直接返回 index.html，避免 404 白屏
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 带 hash 的构建产物可长缓存
    location ~* \.(?:js|css|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 构建产物带内容 hash，文件指纹变了才需要重新请求
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片/SVG 缓存 7 天
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 安全头，静态站够用即可
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 隐藏版本号，减少被针对性扫描
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json \
               image/svg+xml application/xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    access_log /var/log/nginx/site.access.log;
    error_log  /var/log/nginx/site.error.log;
}

